<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProjectBudget</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2027; --panel2: #232c36; --border: #2e3742;
      --text: #e6edf3; --muted: #8b98a5; --accent: #4f9cf9; --good: #3fb950; --bad: #f85149;
      --accent-contrast: #06121f;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7fa; --panel: #ffffff; --panel2: #eef1f5; --border: #d5dbe3;
        --text: #1c2733; --muted: #5b6672; --accent: #1a6fd4; --good: #187a3a; --bad: #c93c37;
        --accent-contrast: #ffffff;
        color-scheme: light;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
             padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { font-size: 18px; margin: 0; }
    .spacer { flex: 1; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    select, button, input[type=file], input[type=date], input[type=text] { font: inherit; color: var(--text);
      background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px; }
    input[type=date] { padding: 4px 8px; font-size: 13px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .ranges button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
    button.danger { border-color: var(--bad); color: var(--bad); }
    button.danger:hover { background: var(--bad); color: var(--accent-contrast); }
    .tools > div { margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    button.del { padding: 2px 9px; font-size: 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .card .value { font-size: 24px; font-weight: 700; margin-top: 6px; }
    .value.good { color: var(--good); } .value.bad { color: var(--bad); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .cat-row { cursor: pointer; }
    .cat-row:hover { background: var(--panel2); }
    .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
    .top5 { background: var(--panel2); }
    .top5 td { color: var(--muted); font-size: 13px; padding-left: 28px; }
    .hidden { display: none; }
    #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 18px; display: flex;
            align-items: center; gap: 14px; flex-wrap: wrap; }
    #uploadMsg { font-size: 13px; color: var(--muted); }
    .pill { background: var(--panel2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
    .empty { color: var(--muted); padding: 30px; text-align: center; }
    a { color: var(--accent); }
    select.recat { padding: 3px 6px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>💰 ProjectBudget</h1>
    <div class="ranges" id="ranges">
      <button data-range="30d">30d</button>
      <button data-range="3mo">3mo</button>
      <button data-range="6mo" class="active">6mo</button>
      <button data-range="1yr">1yr</button>
      <button data-range="all">All</button>
    </div>
    <label class="pill">From <input type="date" id="startDate" /></label>
    <label class="pill">To <input type="date" id="endDate" /></label>
    <div class="spacer"></div>
    <label class="pill">Account
      <select id="accountFilter"><option value="all">All accounts</option></select>
    </label>
    <label class="pill">Anchor
      <select id="anchorFilter">
        <option value="latest">Latest data</option>
        <option value="today">Today</option>
      </select>
    </label>
  </header>

  <main>
    <section id="drop" class="panel" style="margin-bottom:24px">
      <strong>Import statements (CSV)</strong>
      <input type="file" id="fileInput" accept=".csv" multiple />
      <button id="uploadBtn">Upload</button>
      <span id="uploadMsg"></span>
    </section>

    <div class="cards" id="cards"></div>

    <div class="grid2">
      <div class="panel"><h2>Spending by category</h2><canvas id="catChart" height="240"></canvas></div>
      <div class="panel"><h2>Monthly spend trend</h2><canvas id="trendChart" height="240"></canvas></div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>Breakdown <span style="text-transform:none;color:var(--muted)">— click a category for top 5</span></h2>
        <table id="catTable"><tbody></tbody></table>
      </div>
      <div class="panel">
        <h2>Uncategorized — teach the app</h2>
        <table id="uncatTable"><tbody></tbody></table>
      </div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>Learned rules</h2>
        <table id="rulesTable"><tbody></tbody></table>
      </div>
      <div class="panel">
        <h2>Tools</h2>
        <div class="tools">
          <div>
            <strong>Add category</strong>
            <input type="text" id="newCatName" placeholder="e.g. Pets" />
            <button id="addCatBtn">Add</button>
          </div>
          <div>
            <a href="/export/transactions.csv" download>⬇ Export all transactions (CSV)</a>
          </div>
          <div>
            <strong style="color:var(--bad)">Danger zone</strong>
            <button id="resetBtn" class="danger">Delete all data…</button>
          </div>
          <span id="toolsMsg" style="font-size:13px;color:var(--muted)"></span>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/vendor/chart.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
